<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flatpickr Таймер</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    input, button {
      padding: 0.5rem;
      font-size: 1rem;
    }
    #timer {
      margin-top: 1rem;
      font-size: 1.5rem;
      color: darkgreen;
    }
  </style>
</head>
<body>

<h1>Обери дату й час</h1>
<input id="datetime-picker" placeholder="Виберіть дату та час" />
<button id="start-btn" disabled>Запустити таймер</button>

<div id="timer"></div>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="1-timer.js"></script>

</body>
</html>
